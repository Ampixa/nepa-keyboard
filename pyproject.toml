[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nepa-keyboard"
version = "0.1.0"
description = "Offline language-pack tooling for Nepa Keyboard"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
nepa-pack = "nepa_keyboard.compiler:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
