<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Nepal Bhasa Devanagari keyboard extension review</title>
  <desc id="description">Internal beta preview of the additional base, shift, and Devanagari digit rows in the selectable Nepal Bhasa Devanagari phone keyboard.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071a20"/>
      <stop offset="1" stop-color="#16243a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#17323c"/>
      <stop offset="1" stop-color="#102731"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#001016" flood-opacity="0.45"/>
    </filter>
    <style>
      .ui { font-family: Inter, system-ui, sans-serif; }
      .deva { font-family: "Noto Sans Devanagari", "Noto Sans", sans-serif; }
      .key { fill: #203c48; stroke: #426572; stroke-width: 1.5; }
      .special { fill: #273b56; stroke: #62728f; stroke-width: 1.5; }
      .digit { fill: #2b334f; stroke: #596584; stroke-width: 1.5; }
      .glyph { fill: #f8fbff; font: 38px "Noto Sans Devanagari", "Noto Sans", sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .control { fill: #f8fbff; font: 750 20px Inter, system-ui, sans-serif; text-anchor: middle; dominant-baseline: middle; }
      .hint { fill: #9fb4c2; font: 600 13px Inter, system-ui, sans-serif; text-anchor: middle; }
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#background)"/>
  <circle cx="1270" cy="80" r="220" fill="#36d6b0" opacity="0.07"/>
  <circle cx="90" cy="850" r="250" fill="#7387ff" opacity="0.07"/>

  <g class="ui">
    <text x="64" y="72" fill="#f8fbff" font-size="42" font-weight="760">Help us review Nepal Bhasa typing</text>
    <text x="66" y="112" fill="#b6c7d2" font-size="21">Devanagari phone layout · only the Nepal Bhasa additions are shown</text>
    <rect x="1042" y="52" width="334" height="46" rx="23" fill="#f4c96d" opacity="0.14" stroke="#f4c96d"/>
    <text x="1209" y="81" fill="#f4c96d" font-size="15" font-weight="760" text-anchor="middle">INTERNAL BETA · NATIVE REVIEW NEEDED</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="60" y="150" width="1320" height="570" rx="34" fill="url(#panel)" stroke="#31505c" stroke-width="2"/>
  </g>

  <g class="ui">
    <text x="96" y="197" fill="#65e3c4" font-size="15" font-weight="760" letter-spacing="1.5">BASE ADDITION</text>
    <text x="1270" y="197" fill="#91a8b5" font-size="14" text-anchor="end">standard Nepali rows stay unchanged</text>
  </g>
  <g>
    <rect class="key" x="118" y="222" width="138" height="92" rx="17"/><text class="glyph" x="187" y="267">इ</text><text class="hint" x="187" y="301">I</text>
    <rect class="key" x="270" y="222" width="138" height="92" rx="17"/><text class="glyph" x="339" y="267">ई</text><text class="hint" x="339" y="301">II</text>
    <rect class="key" x="422" y="222" width="138" height="92" rx="17"/><text class="glyph" x="491" y="267">ए</text><text class="hint" x="491" y="301">E</text>
    <rect class="key" x="574" y="222" width="138" height="92" rx="17"/><text class="glyph" x="643" y="267">ऱ</text><text class="hint" x="643" y="301">RRA</text>
    <rect class="key" x="726" y="222" width="138" height="92" rx="17"/><text class="glyph" x="795" y="267">◌ः</text><text class="hint" x="795" y="301">VISARGA</text>
    <rect class="key" x="878" y="222" width="138" height="92" rx="17"/><text class="glyph" x="947" y="267">◌़</text><text class="hint" x="947" y="301">NUKTA</text>
    <rect class="special" x="1030" y="222" width="138" height="92" rx="17"/><text class="control" x="1099" y="266">ZWJ</text><text class="hint" x="1099" y="301">CONJUNCT</text>
    <rect class="special" x="1182" y="222" width="138" height="92" rx="17"/><text class="control" x="1251" y="266">ZWNJ</text><text class="hint" x="1251" y="301">CONJUNCT</text>
  </g>

  <g class="ui">
    <text x="96" y="365" fill="#65e3c4" font-size="15" font-weight="760" letter-spacing="1.5">SHIFT ADDITION</text>
    <text x="1270" y="365" fill="#91a8b5" font-size="14" text-anchor="end">rare marks remain explicit and reviewable</text>
  </g>
  <g>
    <rect class="key" x="118" y="390" width="138" height="92" rx="17"/><text class="glyph" x="187" y="435">इ</text><text class="hint" x="187" y="469">I</text>
    <rect class="key" x="270" y="390" width="138" height="92" rx="17"/><text class="glyph" x="339" y="435">ई</text><text class="hint" x="339" y="469">II</text>
    <rect class="key" x="422" y="390" width="138" height="92" rx="17"/><text class="glyph" x="491" y="435">ए</text><text class="hint" x="491" y="469">E</text>
    <rect class="key" x="574" y="390" width="138" height="92" rx="17"/><text class="glyph" x="643" y="435">ऱ</text><text class="hint" x="643" y="469">RRA</text>
    <rect class="key" x="726" y="390" width="138" height="92" rx="17"/><text class="glyph" x="795" y="435">◌ॅ</text><text class="hint" x="795" y="469">CANDRA E</text>
    <rect class="key" x="878" y="390" width="138" height="92" rx="17"/><text class="glyph" x="947" y="435">◌ॉ</text><text class="hint" x="947" y="469">CANDRA O</text>
    <rect class="key" x="1030" y="390" width="138" height="92" rx="17"/><text class="glyph" x="1099" y="435">◌॑</text><text class="hint" x="1099" y="469">UDATTA</text>
    <rect class="key" x="1182" y="390" width="138" height="92" rx="17"/><text class="glyph" x="1251" y="435">◌॒</text><text class="hint" x="1251" y="469">ANUDATTA</text>
  </g>

  <g class="ui">
    <text x="96" y="533" fill="#65e3c4" font-size="15" font-weight="760" letter-spacing="1.5">SYMBOLS · DEVANAGARI DIGITS</text>
    <text x="1270" y="533" fill="#91a8b5" font-size="14" text-anchor="end">complete ०–९ row, not a source-only subset</text>
  </g>
  <g>
    <rect class="digit" x="118" y="558" width="108" height="92" rx="17"/><text class="glyph" x="172" y="604">०</text>
    <rect class="digit" x="239" y="558" width="108" height="92" rx="17"/><text class="glyph" x="293" y="604">१</text>
    <rect class="digit" x="360" y="558" width="108" height="92" rx="17"/><text class="glyph" x="414" y="604">२</text>
    <rect class="digit" x="481" y="558" width="108" height="92" rx="17"/><text class="glyph" x="535" y="604">३</text>
    <rect class="digit" x="602" y="558" width="108" height="92" rx="17"/><text class="glyph" x="656" y="604">४</text>
    <rect class="digit" x="723" y="558" width="108" height="92" rx="17"/><text class="glyph" x="777" y="604">५</text>
    <rect class="digit" x="844" y="558" width="108" height="92" rx="17"/><text class="glyph" x="898" y="604">६</text>
    <rect class="digit" x="965" y="558" width="108" height="92" rx="17"/><text class="glyph" x="1019" y="604">७</text>
    <rect class="digit" x="1086" y="558" width="108" height="92" rx="17"/><text class="glyph" x="1140" y="604">८</text>
    <rect class="digit" x="1207" y="558" width="108" height="92" rx="17"/><text class="glyph" x="1261" y="604">९</text>
  </g>

  <g class="ui">
    <text x="64" y="776" fill="#f8fbff" font-size="25" font-weight="740">We need native-speaker decisions</text>
    <text x="64" y="814" fill="#b6c7d2" font-size="17">Are these keys useful and comfortable? Should rare marks or joiners move to long-press? What should TalkBack call them?</text>
    <text x="64" y="858" fill="#65e3c4" font-size="17" font-weight="720">5,417 candidate words · all 66 accepted scalars reachable · ninth internal profile</text>
    <text x="1376" y="858" fill="#849aa7" font-size="13" text-anchor="end">source f9088679… · API 34 v125 passed</text>
  </g>
</svg>
