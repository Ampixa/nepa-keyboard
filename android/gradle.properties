# The Android build runs on cdjk. These limits keep it from competing with
# unrelated remote workloads or silently growing a large Gradle daemon.
org.gradle.daemon=false
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8
android.useAndroidX=false
android.nonTransitiveRClass=true
